# The generators of the differential test (spec 09.4, 09.5). Each implementation runs on these inputs, and the oracle reference.py gives the expected output.
size: len(xs)
classes:
  tiny: {range: [0, 4], count: 0, exhaustive: true}
  small: {range: [5, 100], count: 40}
  medium: {range: [101, 5000], count: 10}
  large: {range: [100000, 1000000], count: 2}
generators:
  - {name: uniform, file: generators/uniform.py, params: {k: [2, 1000, 0]}}
  - {name: shaped, file: generators/shaped.py, params: {shape: [sorted, reversed, nearly, organ, equal]}}
seeds:
  pr: [1, 2, 3]
  nightly: random
