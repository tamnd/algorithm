# The generators of the differential test (spec 09.4, 09.5). Each implementation runs on these inputs, and the oracle reference.py gives the expected output. When x is in a more than once, checker.py accepts each of its indices.
size: len(a)
classes:
  tiny: {range: [0, 3], count: 0, exhaustive: true}
  small: {range: [4, 100], count: 40}
  medium: {range: [101, 5000], count: 10}
  large: {range: [100000, 1000000], count: 2}
generators:
  - {name: uniform, file: generators/uniform.py, params: {k: [2, 1000, 1000000000]}}
pre: generators/pre.py
seeds:
  pr: [1, 2, 3]
  nightly: random
