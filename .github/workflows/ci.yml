# SPDX-License-Identifier: CC0-1.0
#
# The jobs that run code from the content (audit, tests, site) have no secrets. Only the deploy job has the Cloudflare token, and it runs no code from the content: it uploads the site that the site job made.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ALGO_VERSION: v0.1.0
  GO_VERSION: "1.27.x"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - name: Audit the changed nodes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: algo check -changed "$BASE"
      - name: Audit all nodes
        if: github.event_name != 'pull_request'
        run: algo check -main
      - name: Check the scenes
        run: algo viz check

  test:
    name: Test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [python, cpp, java, c, csharp, javascript, typescript, go, rust, kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.lang == 'python'
        with:
          python-version: "3.14"
      - if: matrix.lang == 'python'
        run: python -m pip install pytest==9.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lang == 'javascript' || matrix.lang == 'typescript'
        with:
          node-version: "24"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.lang == 'java' || matrix.lang == 'kotlin'
        with:
          distribution: temurin
          java-version: "25"
      - name: Install kotlinc
        if: matrix.lang == 'kotlin'
        env:
          KOTLIN_VERSION: 2.4.21
          KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
        run: |
          curl -fsSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlin.zip" | sha256sum -c -
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          rm kotlin.zip
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: "10.0.x"
      - name: Run the tests
        env:
          LANG_ID: ${{ matrix.lang }}
        run: algo test -lang "$LANG_ID" -out build/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.lang }}
          path: build/results
          retention-days: 7

  site:
    needs: [audit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: build/results
          merge-multiple: true
      - name: Render the site and check the links
        run: algo site check -out build/site -minify
      - name: Check the limits of Cloudflare Pages
        run: |
          files=$(find build/site -type f | wc -l)
          big=$(find build/site -type f -size +24M | wc -l)
          echo "The site has $files files."
          if [ "$files" -gt 19500 ]; then echo "::error::The site has more than 19500 files."; exit 1; fi
          if [ "$big" -gt 0 ]; then echo "::error::A file of the site is larger than 24 MB."; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 7

  deploy:
    needs: site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npx --yes wrangler@4.156.2 pages deploy site --project-name algorithm --branch "$BRANCH" --commit-hash "$SHA" --commit-dirty=true | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1)
          if [ "$BRANCH" = main ]; then url=https://algorithm.tamnd.com; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
