# SPDX-License-Identifier: CC0-1.0
#
# The jobs that run code from the content (audit, tests, site) have no secrets. Only the deploy job has the Cloudflare token, and it runs no code from the content: it uploads the site that the site job made.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ALGO_VERSION: v0.1.5
  GO_VERSION: "1.27.x"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - name: Check the format
        run: algo fmt -check
      - name: Show the tags that the merge gives
        if: github.event_name == 'pull_request'
        run: algo mint -dry-run
      - name: Audit the changed nodes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: algo check -changed "$BASE"
      - name: Audit all nodes
        if: github.event_name != 'pull_request'
        run: algo check -main
      - name: Check the scenes
        run: algo viz check

  test:
    name: Test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [python, cpp, java, c, csharp, javascript, typescript, go, rust, kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      # The cache keeps the results of the implementations that passed. A result is used again only while algo, the toolchain, the files of the implementation and the cases stay the same (09.8).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
          restore-keys: test-${{ matrix.lang }}-
      - name: Run the tests
        env:
          LANG_ID: ${{ matrix.lang }}
        # Each build and test runs in a container of the image that manifests/images.yaml pins, with no network (08.7).
        run: algo test -sandbox docker -lang "$LANG_ID" -cache build/test-cache -out build/results
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.lang }}
          path: build/results
          retention-days: 7

  # The Lean package (07). The Mathlib cache gives the compiled Mathlib, so the job builds only the Algo modules. The axiom audit fails if a declaration of Algo depends on an axiom other than propext, Classical.choice and Quot.sound (07.6). Then algo lean build runs AlgoExtract on the built package, checks the lean fields and the class claims, and gives decls.jsonl to the site job.
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: lean
          use-mathlib-cache: "true"
          test: "true"
          axiom-audit: "true"
          axiom-audit-root: Algo
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - name: Extract and check the declarations
        run: algo lean build -no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-decls
          path: build/lean/decls.jsonl
          retention-days: 7

  site:
    needs: [audit, test, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install algo
        run: go install "github.com/tamnd/algorithm-agent/cmd/algo@${ALGO_VERSION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: build/results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lean-decls
          path: build/lean
      - name: Render the site and check the links
        run: algo site check -out build/site -minify
      - name: Check the limits of Cloudflare Pages
        run: |
          files=$(find build/site -type f | wc -l)
          big=$(find build/site -type f -size +24M | wc -l)
          echo "The site has $files files."
          if [ "$files" -gt 19500 ]; then echo "::error::The site has more than 19500 files."; exit 1; fi
          if [ "$big" -gt 0 ]; then echo "::error::A file of the site is larger than 24 MB."; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 7

  deploy:
    needs: site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npx --yes wrangler@4.156.2 pages deploy site --project-name algorithm --branch "$BRANCH" --commit-hash "$SHA" --commit-dirty=true | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1)
          if [ "$BRANCH" = main ]; then url=https://algorithm.tamnd.com; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
